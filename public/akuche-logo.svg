<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="akuche-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#042F24" />
      <stop offset="100%" stopColor="#021B14" />
    </linearGradient>
    <linearGradient id="akuche-emerald" x1="64" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#047857" />
      <stop offset="50%" stopColor="#059669" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="akuche-gold" x1="213" y1="42" x2="298" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="gold-glow" x="180" y="20" width="152" height="152" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.984 0 0 0 0 0.749 0 0 0 0 0.141 0 0 0 0.6 0"/>
      <feBlend mode="normal" in2="BackgroundImageFix" result="effect1_dropShadow" />
      <feBlend mode="normal" in="SourceGraphic" in2="effect1_dropShadow" result="shape" />
    </filter>
  </defs>

  {/* Background with rounded corners */}
  <rect width="512" height="512" rx="112" fill="url(#akuche-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#10b981" stroke-opacity="0.25" stroke-width="8" />

  {/* Left & Right ascending strokes of the iconic "A" */}
  <path
    d="M138 390L236 160C243 145 269 145 276 160L374 390C380 404 369 418 354 418H326C317 418 310 412 306 404L284 345H228L206 404C202 412 195 418 186 418H158C143 418 132 404 138 390Z"
    fill="url(#akuche-emerald)"
  />

  {/* Inner negative space / upward focus */}
  <path
    d="M256 195L296 288H216L256 195Z"
    fill="#021B14"
  />

  {/* Action horizontal crossbar */}
  <rect x="195" y="308" width="122" height="32" rx="16" fill="#34d399" />

  {/* Crown Golden Spark — wisdom node (Ako) */}
  <g filter="url(#gold-glow)">
    <circle cx="256" cy="96" r="34" fill="url(#akuche-gold)" />
  </g>
  <path d="M256 42V64M256 128V150M202 96H224M288 96H310" stroke="#fde047" stroke-width="10" stroke-linecap="round" />
</svg>
